name: Build and Publish

on:
  push:
    branches:
      - 'version/**'
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)
              version="${GITHUB_REF#refs/tags/v}"
              ;;
            refs/heads/version/*)
              version="${GITHUB_REF#refs/heads/version/}-SNAPSHOT"
              ;;
            *)
              echo "::error::Publishing is only allowed for release tags (v*) and version/* branches, got $GITHUB_REF"
              exit 1
              ;;
          esac
          echo "Publishing version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish to Maven Repository
        run: ./gradlew publish -PpublishVersion=${{ steps.version.outputs.version }}
        env:
          MVN_REPO_USERNAME: ${{ secrets.MVN_REPO_USERNAME }}
          MVN_REPO_PASSWORD: ${{ secrets.MVN_REPO_PASSWORD }}
